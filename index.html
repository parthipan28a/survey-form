<!DOCTYPE html>
<html lang="en">
    <title>survey form</title>
   
</html>
<style>
    .container{
        margin: 30px;
       
    }
    .email{
        margin: 30px;
        
       
    }
    .age{
        margin: 30px;
        
    }
    .option{
        margin: 30px;
    }
    .choose{
        margin: 30px;
    }
    .courses{
        margin: 30px;
    }
    .box{
        margin: 30px;
    }

</style>
<body>
    <center>
    <hi style="font-size: 50px;">greeksfor geeks survey form</hi>
    </center>
    <div class="container">
    <tr>
        <td>name</td><br>
        <td><input type="text" placeholder="enter your name"></td>
    </tr><br>
    </div>
    <div class="email">
    <tr>
        <td>email</td><br>
        <td><input type="email" placeholder="enteer your email"</td>
    </tr><br>
    </div>
    <div class="age">
    <tr>
        <td>age</td><br>
        <td><input type="number" placeholder="enter your age"</td>
    </tr><br>
    </div>
    <div class="option">
    <tr>
        <td>which option best describes you ?</td><br>
        <td>
            <select>
            <option>student</option>
            <option>teacher</option>
            <option>principal</option>
        </select>
        </td>
    </tr><br>
    </div>
    <div class="choose">
    <tr>
        <td>whould you reecommend geeksfor geeks to a friend</td>
        <td><br>
            <input type="radio" name="yes">yes
        </td><br>
        <td>
            <input type="radio" name="no">no
        </td><br>
        <td>
            <input type="radio" name="may be">may be
        </td>
    </tr>
    </div>
    <div class="courses">
    <tr>
        <td>languages and frameworks known (check all that apply)</td><br>
        <td><input type="radio" name="c">c</td><br>
        <td><input type="radio" name="c++">c++</td><br>
        <td><input type="radio" name="java">java</td>
    </tr><br>
    </div>
    <div class="box">
    <tr>
        <td>any comments or suggestions</td><br>
        <td><input type="text"></td><br>
    </div>
        <input type="submit" name="submit" style="margin: 30px;">

</body>
